name: Verify public assurance surface

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install verification dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run public conformance tests
        run: python -m pytest -q

      - name: Compile public Python surface
        run: python -m compileall -q conformance adapters tests

      - name: Run public conformance demo
        run: python -m conformance.demo
